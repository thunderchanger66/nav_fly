trajectory_optimizer:
  ros__parameters:

    use_sim_time: true

    # =========================
    # Input
    # =========================
    map_topic: "/uav_mapping/voxel_map"
    path_topic: "/astar/path"

    # =========================
    # UNKNOWN
    # =========================
    unknown_is_free: true
    simplify_allow_unknown: false

    # =========================
    # Reference path
    # =========================
    # 较密的参考点有利于在拐角处生成连续的局部走廊。
    control_point_spacing: 0.3

    # =========================
    # Corridor
    # =========================
    # 每个 span 以局部参考路径段中点为种子，
    # 在无障碍体素中向外扩张 AABB。
    corridor_max_radius: 1.0
    corridor_margin: 0.02

    # =========================
    # QP weights
    # =========================
    # 二阶差分平滑项
    weight_smooth: 20.0

    # 三阶差分 Jerk 项
    # 越大越抑制加速度突变，但太大会让轨迹过度“圆滑”
    weight_jerk: 10.0

    # 参考路径跟踪项
    weight_reference: 2.0

    # =========================
    # Dynamics
    # =========================
    initial_dt: 0.5
    max_vel_axis: 2.0
    max_acc_axis: 2.5

    time_scale_factor: 1.25
    max_time_scaling_attempts: 5

    # =========================
    # Final safety check
    # =========================
    validation_dt: 0.05